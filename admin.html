<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
  <title>অ্যাডমিন প্যানেল - JIBONI</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Hind+Siliguri:wght@500;600;700&display=swap');

    :root {
      --primary: #dc2626;
      --primary-hover: #b91c1c;
      --primary-light: #fee2e2;
      --success: #15803d;
      --success-light: #dcfce7;
      --warning: #b45309;
      --warning-light: #fef3c7;
      --info: #0284c7;
      --info-light: #e0f2fe;
      --slate-50: #f8fafc;
      --slate-100: #f1f5f9;
      --slate-200: #e2e8f0;
      --slate-400: #94a3b8;
      --slate-600: #475569;
      --slate-800: #1e293b;
      --slate-900: #0f172a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Hind Siliguri', 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--slate-50);
      color: var(--slate-800);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .site-header {
      background: #ffffff;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--slate-200);
      text-align: center;
      width: 100%;
    }

    .header-inner {
      max-width: 480px;
      margin: 0 auto;
    }

    .brand-row {
      margin-bottom: 8px;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
    }

    .blood-drop {
      font-size: 1.5rem;
      line-height: 1;
    }

    .brand-name {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: 0.5px;
      line-height: 1;
    }

    .nav-btn-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }

    .btn-chip {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1px solid var(--slate-200);
      background: var(--slate-100);
      color: var(--slate-600);
      cursor: pointer;
    }

    .brand-slogan {
      font-size: 0.74rem;
      color: var(--slate-600);
      font-style: italic;
    }

    .main-wrapper {
      flex: 1;
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
      padding: 16px 14px 40px;
    }

    /* Admin Info Card */
    .admin-info-card {
      background: #ffffff;
      border: 1px solid var(--slate-200);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    }

    .admin-meta-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .badge-super-admin {
      background: #fee2e2;
      color: var(--primary);
      font-size: 0.76rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .admin-email-text {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--slate-800);
    }

    .change-pwd-btn {
      background: var(--slate-100);
      border: 1px solid var(--slate-200);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--slate-600);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* Tabs Row */
    .admin-tabs-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }

    .admin-tabs-row::-webkit-scrollbar {
      display: none;
    }

    .admin-tab {
      flex-shrink: 0;
      padding: 8px 14px;
      border-radius: 25px;
      font-size: 0.82rem;
      font-weight: 700;
      border: 1px solid var(--slate-200);
      background: #ffffff;
      color: var(--slate-600);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .admin-tab.active {
      background: var(--slate-900);
      color: #ffffff;
      border-color: var(--slate-900);
    }

    .tab-counter {
      background: var(--primary);
      color: #ffffff;
      font-size: 0.72rem;
      padding: 1px 7px;
      border-radius: 12px;
    }

    .admin-tab:not(.active) .tab-counter {
      background: var(--slate-200);
      color: var(--slate-800);
    }

    /* Search Box */
    .search-input-wrap {
      margin-bottom: 14px;
    }

    .admin-search-input {
      width: 100%;
      height: 44px;
      padding: 0 14px;
      background: #ffffff;
      border: 1px solid var(--slate-200);
      border-radius: 12px;
      font-size: 0.88rem;
      color: var(--slate-800);
      outline: none;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
    }

    .admin-search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(220, 38, 38, 0.1);
    }

    /* Donor Card */
    .donor-admin-card {
      background: #ffffff;
      border: 1px solid var(--slate-200);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }

    .card-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .donor-card-name {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--slate-900);
    }

    .blood-chip {
      background: #fff1f2;
      color: var(--primary);
      border: 1px solid #ffe4e6;
      font-weight: 800;
      font-size: 0.85rem;
      padding: 2px 10px;
      border-radius: 8px;
    }

    /* CLEAN NATURAL COLON ALIGNMENT (NO UNWANTED GAPS) */
    .donor-detail-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      font-size: 0.84rem;
      color: var(--slate-600);
      margin-bottom: 14px;
    }

    .detail-item {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      line-height: 1.45;
    }

    .detail-label {
      font-weight: 700;
      color: var(--slate-800);
      flex-shrink: 0;
      white-space: nowrap;
    }

    .detail-val {
      flex: 1;
      color: var(--slate-800);
      word-break: break-word;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.74rem;
      font-weight: 700;
    }

    .badge-avail {
      background: var(--success-light);
      color: var(--success);
    }

    .badge-rest {
      background: var(--warning-light);
      color: var(--warning);
    }

    .badge-next {
      background: var(--info-light);
      color: var(--info);
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 700;
    }

    /* Action Buttons Row */
    .admin-actions-grid {
      display: flex;
      align-items: center;
      gap: 8px;
      border-top: 1px solid var(--slate-100);
      padding-top: 12px;
    }

    .btn-verify {
      flex: 1;
      height: 38px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      border: 1px solid #bbf7d0;
      background: #f0fdf4;
      color: var(--success);
    }

    .btn-toggle-avail {
      flex: 1;
      height: 38px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--slate-200);
      background: #ffffff;
      color: var(--slate-700);
    }

    .btn-delete {
      width: 40px;
      height: 38px;
      border-radius: 8px;
      border: 1px solid #fee2e2;
      background: #fff5f5;
      color: var(--primary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
    }

    .empty-state {
      background: #ffffff;
      border: 1px dashed var(--slate-200);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      color: var(--slate-400);
      font-size: 0.86rem;
    }

    .site-footer {
      background: #ffffff;
      border-top: 1px solid var(--slate-200);
      padding: 12px 16px 16px;
      text-align: center;
      margin-top: auto;
      width: 100%;
    }

    .footer-disclaimer {
      font-size: 0.72rem;
      color: var(--slate-600);
      margin-bottom: 3px;
    }

    .footer-credit {
      font-size: 0.75rem;
      color: var(--slate-800);
    }

    .footer-credit a {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="brand-row">
        <a href="index.html" class="brand-logo">
          <span class="blood-drop">🩸</span>
          <span class="brand-name">JIBONI</span>
        </a>
      </div>

      <div class="nav-btn-row">
        <a href="index.html" class="btn-chip">← হোম পেজ</a>
        <a href="register.html" class="btn-chip">+ ডোনার নিবন্ধন</a>
        <a href="developer.html" class="btn-chip">👨‍💻 ডেভেলপার</a>
      </div>

      <p class="brand-slogan">"অচেনা কাউকে বাঁচার আশা দিয়ে, লিখে যাও এক নিঃস্বার্থ জীবনী।"</p>
    </div>
  </header>

  <main class="main-wrapper">
    <!-- Admin Info Header -->
    <div class="admin-info-card">
      <div class="admin-meta-row">
        <span class="badge-super-admin">Super Admin</span>
        <span class="admin-email-text" id="adminEmailDisplay">amanullaemon04@gmail.com</span>
      </div>
      <button type="button" class="change-pwd-btn" onclick="alert('পাসওয়ার্ড পরিবর্তনের সুবিধা শীঘ্রই যুক্ত হবে।')">🔑 পাসওয়ার্ড পরিবর্তন</button>
    </div>

    <!-- Tabs Navigation -->
    <div class="admin-tabs-row">
      <button type="button" class="admin-tab active" id="tabAll" onclick="switchTab('all')">
        👥 সকল রক্তদাতা <span class="tab-counter" id="countAll">0</span>
      </button>
      <button type="button" class="admin-tab" id="tabPending" onclick="switchTab('pending')">
        ⏳ পেন্ডিং ভেরিফিকেশন <span class="tab-counter" id="countPending">0</span>
      </button>
      <button type="button" class="admin-tab" id="tabAvailable" onclick="switchTab('available')">
        ⚡ প্রস্তুত <span class="tab-counter" id="countAvailable">0</span>
      </button>
    </div>

    <!-- Search Input -->
    <div class="search-input-wrap">
      <input type="text" id="adminSearchQuery" class="admin-search-input" placeholder="নাম, জেলা, উপজেলা, মোবাইল বা রক্তের গ্রুপ দিয়ে খুঁজুন..." onkeyup="renderAdminDonors()" />
    </div>

    <!-- Donors List Container -->
    <div id="adminDonorsList"></div>
  </main>

  <footer class="site-footer">
    <p class="footer-disclaimer">Use donor information responsibly. Confirm availability before contacting.</p>
    <p class="footer-credit">Designed & Developed by <a href="developer.html">Amanulla Emon</a></p>
  </footer>

  <script>
    let currentTab = "all";

    function checkEligibility(lastDonationDateStr) {
      if (!lastDonationDateStr || lastDonationDateStr === "তথ্য নেই") return true;
      var lastDate = new Date(lastDonationDateStr);
      var today = new Date();
      var diffDays = (today - lastDate) / (1000 * 60 * 60 * 24);
      return diffDays >= 120;
    }

    function calculateNextEligibleDate(lastDonationDateStr) {
      if (!lastDonationDateStr || lastDonationDateStr === "তথ্য নেই") return null;
      var d = new Date(lastDonationDateStr);
      if (isNaN(d.getTime())) return null;
      d.setMonth(d.getMonth() + 4);
      var yyyy = d.getFullYear();
      var mm = String(d.getMonth() + 1).padStart(2, '0');
      var dd = String(d.getDate()).padStart(2, '0');
      return yyyy + "-" + mm + "-" + dd;
    }

    function getDonors() {
      var stored = localStorage.getItem("jiboni_donors_cache") || localStorage.getItem("donors");
      if (stored) {
        try {
          return JSON.parse(stored);
        } catch(e) {}
      }
      return [
        { id: 1, name: "Amanulla Emon", blood_group: "B+", phone: "01608575239", district: "Dhaka", upazila: "শাহবাগ / ঢাবি (Shahbagh / DU)", hall: "Shahid Sergeant Zahurul Huq Hall", last_donation: "2026-09-02", is_available: false, is_verified: true },
        { id: 2, name: "Arafat", blood_group: "A+", phone: "01602689896", district: "Dhaka", upazila: "শাহবাগ / ঢাবি (Shahbagh / DU)", hall: "Shahid Sergeant Zahurul Huq Hall", last_donation: "2026-08-02", is_available: false, is_verified: true }
      ];
    }

    function saveDonors(list) {
      localStorage.setItem("jiboni_donors_cache", JSON.stringify(list));
      localStorage.setItem("donors", JSON.stringify(list));
      renderAdminDonors();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll(".admin-tab").forEach(function(btn) { btn.classList.remove("active"); });
      if (tab === "all") document.getElementById("tabAll").classList.add("active");
      if (tab === "pending") document.getElementById("tabPending").classList.add("active");
      if (tab === "available") document.getElementById("tabAvailable").classList.add("active");
      renderAdminDonors();
    }

    function renderAdminDonors() {
      var allDonors = getDonors();
      var q = (document.getElementById("adminSearchQuery").value || "").trim().toLowerCase();
      var container = document.getElementById("adminDonorsList");

      // Update Tab Badges Count
      var countAll = allDonors.length;
      var countPending = allDonors.filter(function(d) { return !d.is_verified; }).length;
      var countAvailable = allDonors.filter(function(d) { return d.is_available; }).length;

      document.getElementById("countAll").innerText = countAll;
      document.getElementById("countPending").innerText = countPending;
      document.getElementById("countAvailable").innerText = countAvailable;

      // Filter by Tab
      var filtered = allDonors.filter(function(d) {
        if (currentTab === "pending") return !d.is_verified;
        if (currentTab === "available") return d.is_available;
        return true;
      });

      // Filter by Search Query
      if (q) {
        filtered = filtered.filter(function(d) {
          var name = (d.name || "").toLowerCase();
          var dist = (d.district || "").toLowerCase();
          var upz = (d.upazila || "").toLowerCase();
          var hall = (d.hall || "").toLowerCase();
          var phone = (d.phone || "").toLowerCase();
          var bg = (d.blood_group || d.bloodGroup || "").toLowerCase();
          return name.includes(q) || dist.includes(q) || upz.includes(q) || hall.includes(q) || phone.includes(q) || bg.includes(q);
        });
      }

      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-state">কোনো রক্তদাতার তথ্য খুঁজে পাওয়া যায়নি।</div>';
        return;
      }

      var html = "";
      filtered.forEach(function(d) {
        var isEligible = checkEligibility(d.last_donation);
        var nextDate = calculateNextEligibleDate(d.last_donation);

        // Location formatting: জেলা, উপজেলা (নির্দিষ্ট এলাকা/হল)
        var locParts = [];
        if (d.district) locParts.push(d.district);
        if (d.upazila) locParts.push(d.upazila);
        var mainLoc = locParts.join(", ");
        if (d.hall) {
          mainLoc += mainLoc ? " (" + d.hall + ")" : d.hall;
        }
        if (!mainLoc) mainLoc = "তথ্য নেই";

        var statusBadge = d.is_available
          ? '<span class="status-badge badge-avail">● প্রস্তুত (Available)</span>'
          : '<span class="status-badge badge-rest">⏳ বিরতি কালীন (4-Month Rest)</span>';

        var nextDateHtml = "";
        if (nextDate && !isEligible) {
          nextDateHtml = 
            '<div class="detail-item">' +
              '<span class="detail-label">🗓️ পরবর্তী রক্তদান:</span>' +
              '<span class="detail-val"><span class="badge-next">' + nextDate + ' (থেকে সম্ভাব্য)</span></span>' +
            '</div>';
        } else if (isEligible && d.last_donation && d.last_donation !== "তথ্য নেই") {
          nextDateHtml = 
            '<div class="detail-item">' +
              '<span class="detail-label">🗓️ পরবর্তী রক্তদান:</span>' +
              '<span class="detail-val" style="color:var(--success); font-weight:700;">✅ যেকোনো সময় সক্ষম</span>' +
            '</div>';
        }

        var verifyBtnHtml = d.is_verified
          ? '<button type="button" class="btn-verify" style="background:#f0fdf4; border-color:#bbf7d0; color:var(--success);" onclick="toggleVerify(' + d.id + ')">✓ অনুমোদিত</button>'
          : '<button type="button" class="btn-verify" style="background:#fffbeb; border-color:#fde68a; color:var(--warning);" onclick="toggleVerify(' + d.id + ')">⏳ অনুমোদন করুন</button>';

        var toggleAvailText = d.is_available ? "Make Unavailable" : "Make Available";

        html += 
          '<div class="donor-admin-card">' +
            '<div class="card-top-row">' +
              '<span class="donor-card-name">' + (d.name || "অজ্ঞাত ডোনার") + '</span>' +
              '<span class="blood-chip">' + (d.blood_group || d.bloodGroup || "--") + '</span>' +
            '</div>' +
            '<div class="donor-detail-list">' +
              '<div class="detail-item">' +
                '<span class="detail-label">📞 মোবাইল:</span>' +
                '<span class="detail-val">' + (d.phone || "--") + '</span>' +
              '</div>' +
              '<div class="detail-item">' +
                '<span class="detail-label">📍 ঠিকানা/হল:</span>' +
                '<span class="detail-val">' + mainLoc + '</span>' +
              '</div>' +
              '<div class="detail-item">' +
                '<span class="detail-label">🗓️ সর্বশেষ রক্তদান:</span>' +
                '<span class="detail-val">' + (d.last_donation || "তথ্য নেই") + '</span>' +
              '</div>' +
              '<div class="detail-item">' +
                '<span class="detail-label">⚡ স্ট্যাটাস:</span>' +
                '<span class="detail-val">' + statusBadge + '</span>' +
              '</div>' +
              nextDateHtml +
            '</div>' +
            '<div class="admin-actions-grid">' +
              verifyBtnHtml +
              '<button type="button" class="btn-toggle-avail" onclick="toggleAvailability(' + d.id + ')">' + toggleAvailText + '</button>' +
              '<button type="button" class="btn-delete" title="মুছে ফেলুন" onclick="deleteDonor(' + d.id + ')">🗑️</button>' +
            '</div>' +
          '</div>';
      });

      container.innerHTML = html;
    }

    function toggleVerify(id) {
      var donors = getDonors();
      var donor = donors.find(function(d) { return d.id === id; });
      if (donor) {
        donor.is_verified = !donor.is_verified;
        saveDonors(donors);
      }
    }

    function toggleAvailability(id) {
      var donors = getDonors();
      var donor = donors.find(function(d) { return d.id === id; });
      if (donor) {
        donor.is_available = !donor.is_available;
        donor.manual_override = true;
        saveDonors(donors);
      }
    }

    function deleteDonor(id) {
      if (confirm("আপনি কি নিশ্চিতভাবে এই রক্তদাতার তথ্য মুছে ফেলতে চান?")) {
        var donors = getDonors();
        donors = donors.filter(function(d) { return d.id !== id; });
        saveDonors(donors);
      }
    }

    window.onload = function() {
      renderAdminDonors();
    };
  </script>
</body>
</html>
