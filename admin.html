<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
  <title>অ্যাডমিন প্যানেল - JIBONI</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Hind+Siliguri:wght@500;600;700&display=swap');

    :root {
      --primary: #dc2626;
      --primary-hover: #b91c1c;
      --primary-light: #fee2e2;
      --success: #15803d;
      --success-light: #dcfce7;
      --warning: #b45309;
      --warning-light: #fef3c7;
      --info: #0284c7;
      --info-light: #e0f2fe;
      --slate-50: #f8fafc;
      --slate-100: #f1f5f9;
      --slate-200: #e2e8f0;
      --slate-400: #94a3b8;
      --slate-600: #475569;
      --slate-800: #1e293b;
      --slate-900: #0f172a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Hind Siliguri', 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--slate-50);
      color: var(--slate-800);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .site-header {
      background: #ffffff;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--slate-200);
      text-align: center;
      width: 100%;
    }

    .header-inner {
      max-width: 480px;
      margin: 0 auto;
    }

    .brand-row {
      margin-bottom: 8px;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
    }

    .blood-drop {
      font-size: 1.5rem;
      line-height: 1;
    }

    .brand-name {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: 0.5px;
      line-height: 1;
    }

    .nav-btn-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }

    .btn-chip {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1px solid var(--slate-200);
      background: var(--slate-100);
      color: var(--slate-600);
      cursor: pointer;
    }

    .brand-slogan {
      font-size: 0.74rem;
      color: var(--slate-600);
      font-style: italic;
    }

    .app-main {
      flex: 1;
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
      padding: 16px 14px 40px;
    }

    .admin-card {
      background: #ffffff;
      border: 1px solid var(--slate-200);
      border-radius: 16px;
      padding: 20px 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--slate-900);
      text-align: center;
      margin-bottom: 16px;
    }

    /* ICONIC RED & WHITE CUSTOM MODAL OVERLAYS */
    .custom-alert-overlay,
    .custom-confirm-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 4000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .custom-alert-box {
      background: #ffffff;
      border-radius: 20px;
      padding: 24px 20px;
      max-width: 340px;
      width: 100%;
      box-shadow: 0 14px 35px rgba(220, 38, 38, 0.15);
      text-align: center;
      border-top: 4px solid var(--primary);
      animation: scaleIn 0.2s ease-out;
    }

    @keyframes scaleIn {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .custom-alert-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--slate-900);
      margin-bottom: 8px;
    }

    .custom-alert-msg {
      font-size: 0.88rem;
      color: var(--slate-600);
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .custom-alert-btn {
      width: 100%;
      height: 42px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.25);
    }

    .custom-confirm-btns {
      display: flex;
      gap: 10px;
    }

    .custom-confirm-cancel {
      flex: 1;
      height: 42px;
      background: #ffffff;
      color: var(--slate-600);
      border: 1px solid var(--slate-200);
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }

    .custom-confirm-ok {
      flex: 1;
      height: 42px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.25);
    }

    .site-footer {
      background: #ffffff;
      border-top: 1px solid var(--slate-200);
      padding: 12px 16px 16px;
      text-align: center;
      margin-top: auto;
      width: 100%;
    }

    .footer-disclaimer {
      font-size: 0.72rem;
      color: var(--slate-600);
      margin-bottom: 3px;
    }

    .footer-credit {
      font-size: 0.75rem;
      color: var(--slate-800);
    }

    .footer-credit a {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="brand-row">
        <a href="index.html" class="brand-logo">
          <span class="blood-drop">🩸</span>
          <span class="brand-name">JIBONI</span>
        </a>
      </div>

      <div class="nav-btn-row">
        <a href="index.html" class="btn-chip">← হোম পেজ</a>
        <a href="developer.html" class="btn-chip">👨‍💻 ডেভেলপার</a>
      </div>

      <p class="brand-slogan">"অচেনা কাউকে বাঁচার আশা দিয়ে, লিখে যাও এক নিঃস্বার্থ জীবনী।"</p>
    </div>
  </header>

  <main class="app-main">
    <div class="admin-card">
      <h2 class="card-title">অ্যাডমিন প্যানেল</h2>
      <!-- Admin Content Container -->
      <div id="adminContent">
        <p style="text-align: center; color: var(--slate-600); font-size: 0.9rem;">অ্যাডমিন কন্ট্রোল লোড হচ্ছে...</p>
      </div>
    </div>
  </main>

  <!-- JIBONI ICONIC RED & WHITE ALERT MODAL -->
  <div id="customAlertModal" class="custom-alert-overlay">
    <div class="custom-alert-box">
      <h3 class="custom-alert-title" id="customAlertTitle">সতর্কবার্তা</h3>
      <p class="custom-alert-msg" id="customAlertMsg">বার্তা...</p>
      <button type="button" class="custom-alert-btn" onclick="closeCustomAlert()">ঠিক আছে</button>
    </div>
  </div>

  <!-- JIBONI ICONIC RED & WHITE CONFIRM MODAL -->
  <div id="customConfirmModal" class="custom-confirm-overlay">
    <div class="custom-alert-box">
      <h3 class="custom-alert-title" id="customConfirmTitle">নিশ্চিতকরণ</h3>
      <p class="custom-alert-msg" id="customConfirmMsg">আপনি কি নিশ্চিত?</p>
      <div class="custom-confirm-btns">
        <button type="button" class="custom-confirm-cancel" onclick="closeCustomConfirm(false)">বাতিল</button>
        <button type="button" class="custom-confirm-ok" onclick="closeCustomConfirm(true)">নিশ্চিত করুন</button>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <p class="footer-disclaimer">JIBONI — রক্তদানে সচেতনতা আমাদের লক্ষ্য</p>
    <p class="footer-credit">Designed & Developed by <a href="developer.html">Amanulla Emon</a></p>
  </footer>

  <script>
    // Custom Iconic JIBONI Popups replacing standard alert/confirm
    function showJiboniAlert(title, msg, callback) {
      document.getElementById("customAlertTitle").innerText = title;
      document.getElementById("customAlertMsg").innerText = msg;
      document.getElementById("customAlertModal").style.display = "flex";
      window.jiboniAlertCallback = callback;
    }

    function closeCustomAlert() {
      document.getElementById("customAlertModal").style.display = "none";
      if (typeof window.jiboniAlertCallback === "function") {
        var cb = window.jiboniAlertCallback;
        window.jiboniAlertCallback = null;
        cb();
      }
    }

    function showJiboniConfirm(title, msg, callback) {
      document.getElementById("customConfirmTitle").innerText = title;
      document.getElementById("customConfirmMsg").innerText = msg;
      document.getElementById("customConfirmModal").style.display = "flex";
      window.jiboniConfirmCallback = callback;
    }

    function closeCustomConfirm(isConfirmed) {
      document.getElementById("customConfirmModal").style.display = "none";
      if (typeof window.jiboniConfirmCallback === "function") {
        var cb = window.jiboniConfirmCallback;
        window.jiboniConfirmCallback = null;
        cb(isConfirmed);
      }
    }

    // Example replacement in Admin action functions:
    // Instead of: if(confirm("আপনি কি নিশ্চিতভাবে এই রক্তদাতার তথ্য মুছে ফেলতে চান?")) { ... }
    // Use: showJiboniConfirm("ডিলিট নিশ্চিতকরণ", "আপনি কি নিশ্চিতভাবে এই রক্তদাতার তথ্য মুছে ফেলতে চান?", function(yes) { if(yes) { ... } });
  </script>
</body>
</html>
