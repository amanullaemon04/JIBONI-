<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
  <title>অ্যাডমিন প্যানেল - JIBONI</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Hind+Siliguri:wght@500;600;700&display=swap');

    :root {
      --primary: #dc2626;
      --primary-hover: #b91c1c;
      --primary-light: #fee2e2;
      --success: #15803d;
      --success-light: #dcfce7;
      --warning: #b45309;
      --warning-light: #fef3c7;
      --info: #0284c7;
      --info-light: #e0f2fe;
      --slate-50: #f8fafc;
      --slate-100: #f1f5f9;
      --slate-200: #e2e8f0;
      --slate-400: #94a3b8;
      --slate-600: #475569;
      --slate-800: #1e293b;
      --slate-900: #0f172a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Hind Siliguri', 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--slate-50);
      color: var(--slate-800);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .site-header {
      background: #ffffff;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--slate-200);
      text-align: center;
      width: 100%;
    }

    .header-inner {
      max-width: 480px;
      margin: 0 auto;
    }

    .brand-row {
      margin-bottom: 8px;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
    }

    .blood-drop {
      font-size: 1.5rem;
      line-height: 1;
    }

    .brand-name {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: 0.5px;
      line-height: 1;
    }

    .nav-btn-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }

    .btn-chip {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1px solid var(--slate-200);
      background: var(--slate-100);
      color: var(--slate-600);
      cursor: pointer;
    }

    .brand-slogan {
      font-size: 0.74rem;
      color: var(--slate-600);
      font-style: italic;
    }

    .app-main {
      flex: 1;
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
      padding: 16px 14px 40px;
    }

    .admin-card {
      background: #ffffff;
      border: 1px solid var(--slate-200);
      border-radius: 16px;
      padding: 20px 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--slate-900);
      text-align: center;
      margin-bottom: 16px;
    }

    .text-input {
      width: 100%;
      height: 44px;
      padding: 0 12px;
      background: #ffffff;
      border: 1px solid var(--slate-200);
      border-radius: 10px;
      font-size: 0.88rem;
      color: var(--slate-800);
      outline: none;
      transition: all 0.2s;
    }

    .text-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(220, 38, 38, 0.1);
    }

    .submit-btn {
      width: 100%;
      height: 44px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.25);
      transition: all 0.15s;
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    /* JIBONI ICONIC RED & WHITE MODALS */
    .custom-alert-overlay,
    .custom-confirm-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 4000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .custom-alert-box {
      background: #ffffff;
      border-radius: 20px;
      padding: 24px 20px;
      max-width: 340px;
      width: 100%;
      box-shadow: 0 14px 35px rgba(220, 38, 38, 0.15);
      text-align: center;
      border-top: 4px solid var(--primary);
      animation: scaleIn 0.2s ease-out;
    }

    @keyframes scaleIn {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .custom-alert-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--slate-900);
      margin-bottom: 8px;
    }

    .custom-alert-msg {
      font-size: 0.88rem;
      color: var(--slate-600);
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .custom-alert-btn {
      width: 100%;
      height: 42px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.25);
    }

    .custom-confirm-btns {
      display: flex;
      gap: 10px;
    }

    .custom-confirm-cancel {
      flex: 1;
      height: 42px;
      background: #ffffff;
      color: var(--slate-600);
      border: 1px solid var(--slate-200);
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }

    .custom-confirm-ok {
      flex: 1;
      height: 42px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.25);
    }

    .site-footer {
      background: #ffffff;
      border-top: 1px solid var(--slate-200);
      padding: 12px 16px 16px;
      text-align: center;
      margin-top: auto;
      width: 100%;
    }

    .footer-disclaimer {
      font-size: 0.72rem;
      color: var(--slate-600);
      margin-bottom: 3px;
    }

    .footer-credit {
      font-size: 0.75rem;
      color: var(--slate-800);
    }

    .footer-credit a {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="brand-row">
        <a href="index.html" class="brand-logo">
          <span class="blood-drop">🩸</span>
          <span class="brand-name">JIBONI</span>
        </a>
      </div>

      <div class="nav-btn-row">
        <a href="index.html" class="btn-chip">← হোম পেজ</a>
        <a href="developer.html" class="btn-chip">👨‍💻 ডেভেলপার</a>
      </div>

      <p class="brand-slogan">"অচেনা কাউকে বাঁচার আশা দিয়ে, লিখে যাও এক নিঃস্বার্থ জীবনী।"</p>
    </div>
  </header>

  <main class="app-main">
    <div class="admin-card">
      <h2 class="card-title">অ্যাডমিন প্যানেল</h2>
      <div id="adminContent">
        <!-- ADMIN LOGIN / DASHBOARD DYNAMIC CONTENT -->
      </div>
    </div>
  </main>

  <!-- JIBONI ICONIC RED & WHITE ALERT MODAL -->
  <div id="customAlertModal" class="custom-alert-overlay">
    <div class="custom-alert-box">
      <h3 class="custom-alert-title" id="customAlertTitle">সতর্কবার্তা</h3>
      <p class="custom-alert-msg" id="customAlertMsg">বার্তা...</p>
      <button type="button" class="custom-alert-btn" onclick="closeCustomAlert()">ঠিক আছে</button>
    </div>
  </div>

  <!-- JIBONI ICONIC RED & WHITE CONFIRM MODAL -->
  <div id="customConfirmModal" class="custom-confirm-overlay">
    <div class="custom-alert-box">
      <h3 class="custom-alert-title" id="customConfirmTitle">নিশ্চিতকরণ</h3>
      <p class="custom-alert-msg" id="customConfirmMsg">আপনি কি নিশ্চিত?</p>
      <div class="custom-confirm-btns">
        <button type="button" class="custom-confirm-cancel" onclick="closeCustomConfirm(false)">বাতিল</button>
        <button type="button" class="custom-confirm-ok" onclick="closeCustomConfirm(true)">নিশ্চিত করুন</button>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <p class="footer-disclaimer">JIBONI — রক্তদানে সচেতনতা আমাদের লক্ষ্য</p>
    <p class="footer-credit">Designed & Developed by <a href="developer.html">Amanulla Emon</a></p>
  </footer>

  <script>
    // Custom Iconic JIBONI Popups
    function showJiboniAlert(title, msg, callback) {
      document.getElementById("customAlertTitle").innerText = title;
      document.getElementById("customAlertMsg").innerText = msg;
      document.getElementById("customAlertModal").style.display = "flex";
      window.jiboniAlertCallback = callback;
    }

    function closeCustomAlert() {
      document.getElementById("customAlertModal").style.display = "none";
      if (typeof window.jiboniAlertCallback === "function") {
        var cb = window.jiboniAlertCallback;
        window.jiboniAlertCallback = null;
        cb();
      }
    }

    function showJiboniConfirm(title, msg, callback) {
      document.getElementById("customConfirmTitle").innerText = title;
      document.getElementById("customConfirmMsg").innerText = msg;
      document.getElementById("customConfirmModal").style.display = "flex";
      window.jiboniConfirmCallback = callback;
    }

    function closeCustomConfirm(isConfirmed) {
      document.getElementById("customConfirmModal").style.display = "none";
      if (typeof window.jiboniConfirmCallback === "function") {
        var cb = window.jiboniConfirmCallback;
        window.jiboniConfirmCallback = null;
        cb(isConfirmed);
      }
    }

    // Admin Panel Core Logic
    var ADMIN_PIN_KEY = "jiboni_admin_pin";
    var defaultAdminPin = "1234";

    function checkAdminAuth() {
      var isAuth = sessionStorage.getItem("jiboni_admin_logged") === "true";
      var container = document.getElementById("adminContent");

      if (!isAuth) {
        container.innerHTML = `
          <div style="text-align:center;">
            <p style="font-size:0.86rem; color:var(--slate-600); margin-bottom:14px;">অ্যাডমিন প্যানেলে প্রবেশ করতে পিন দিন</p>
            <form onsubmit="handleAdminLogin(event)">
              <div style="margin-bottom:14px;">
                <input type="password" id="adminPinInput" class="text-input" placeholder="অ্যাডমিন পিন (ডিফল্ট: 1234)" required autocomplete="current-password" />
              </div>
              <button type="submit" class="submit-btn">লগইন করুন</button>
            </form>
          </div>
        `;
      } else {
        renderAdminDashboard();
      }
    }

    function handleAdminLogin(e) {
      e.preventDefault();
      var pin = document.getElementById("adminPinInput").value.trim();
      var savedPin = localStorage.getItem(ADMIN_PIN_KEY) || defaultAdminPin;

      if (pin === savedPin) {
        sessionStorage.setItem("jiboni_admin_logged", "true");
        renderAdminDashboard();
      } else {
        showJiboniAlert("ত্রুটি", "ভুল অ্যাডমিন পিন দিয়েছেন!");
      }
    }

    function handleAdminLogout() {
      showJiboniConfirm("লগআউট", "আপনি কি অ্যাডমিন প্যানেল থেকে লগআউট করতে চান?", function(yes) {
        if (yes) {
          sessionStorage.removeItem("jiboni_admin_logged");
          checkAdminAuth();
        }
      });
    }

    function renderAdminDashboard() {
      var container = document.getElementById("adminContent");
      var donors = JSON.parse(localStorage.getItem("jiboni_donors_cache") || localStorage.getItem("donors") || "[]");
      var pending = donors.filter(function(d) { return !d.is_verified; });
      var approved = donors.filter(function(d) { return d.is_verified; });

      var html = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; border-bottom:1px solid var(--slate-100); padding-bottom:10px;">
          <span style="font-weight:800; font-size:0.9rem; color:var(--slate-900);">👑 সুপার অ্যাডমিন</span>
          <button type="button" class="btn-chip" onclick="handleAdminLogout()" style="color:var(--primary); border-color:var(--primary);">লগআউট</button>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;">
          <div style="background:var(--slate-50); border:1px solid var(--slate-200); padding:12px; border-radius:12px; text-align:center;">
            <div style="font-size:1.3rem; font-weight:800; color:var(--primary);">${approved.length}</div>
            <div style="font-size:0.75rem; color:var(--slate-600); font-weight:700;">অনুমোদিত রক্তদাতা</div>
          </div>
          <div style="background:var(--slate-50); border:1px solid var(--slate-200); padding:12px; border-radius:12px; text-align:center;">
            <div style="font-size:1.3rem; font-weight:800; color:var(--warning);">${pending.length}</div>
            <div style="font-size:0.75rem; color:var(--slate-600); font-weight:700;">পেন্ডিং ভেরিফিকেশন</div>
          </div>
        </div>
      `;

      if (pending.length > 0) {
        html += `<h3 style="font-size:0.92rem; font-weight:800; margin-bottom:10px; color:var(--warning);">পেন্ডিং তালিকা:</h3>`;
        pending.forEach(function(d) {
          html += `
            <div style="background:var(--slate-50); border:1px solid var(--slate-200); padding:12px; border-radius:12px; margin-bottom:10px; font-size:0.85rem;">
              <div style="font-weight:800; color:var(--slate-900);">${d.name} (${d.blood_group})</div>
              <div style="color:var(--slate-600); margin:4px 0;">ফোন: ${d.phone} | জেলা: ${d.district}</div>
              <div style="display:flex; gap:8px; margin-top:8px;">
                <button type="button" class="submit-btn" style="height:32px; font-size:0.8rem;" onclick="approveDonor(${d.id})">অনুমোদন করুন</button>
                <button type="button" class="btn-chip" style="height:32px; flex:1; justify-content:center; color:var(--primary); border-color:var(--primary);" onclick="deleteDonor(${d.id})">মুছে ফেলুন</button>
              </div>
            </div>
          `;
        });
      } else {
        html += `<p style="text-align:center; color:var(--slate-400); font-size:0.85rem; padding:20px 0;">কোনো পেন্ডিং ডোনার নেই</p>`;
      }

      container.innerHTML = html;
    }

    function approveDonor(id) {
      var donors = JSON.parse(localStorage.getItem("jiboni_donors_cache") || localStorage.getItem("donors") || "[]");
      var d = donors.find(function(item) { return item.id === id; });
      if (d) {
        d.is_verified = true;
        localStorage.setItem("jiboni_donors_cache", JSON.stringify(donors));
        localStorage.setItem("donors", JSON.stringify(donors));
        showJiboniAlert("সফল", "ডোনার সফলভাবে অনুমোদিত হয়েছে!");
        renderAdminDashboard();
      }
    }

    function deleteDonor(id) {
      showJiboniConfirm("ডিলিট নিশ্চিতকরণ", "আপনি কি নিশ্চিতভাবে এই রক্তদাতার তথ্য মুছে ফেলতে চান?", function(yes) {
        if (yes) {
          var donors = JSON.parse(localStorage.getItem("jiboni_donors_cache") || localStorage.getItem("donors") || "[]");
          donors = donors.filter(function(item) { return item.id !== id; });
          localStorage.setItem("jiboni_donors_cache", JSON.stringify(donors));
          localStorage.setItem("donors", JSON.stringify(donors));
          showJiboniAlert("সফল", "রক্তদাতার তথ্য সফলভাবে মুছে ফেলা হয়েছে।");
          renderAdminDashboard();
        }
      });
    }

    // Run Auth check on load
    window.onload = function() {
      checkAdminAuth();
    };
  </script>
</body>
</html>
