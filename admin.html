<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - BADHAN ZH</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .admin-controls {
      display: flex;
      gap: 5px;
      margin-bottom: 12px;
      margin-top: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .tab-btn {
      flex: 1;
      min-width: 82px;
      height: 38px;
      border: 1px solid var(--border-color);
      background: rgba(255, 255, 255, 0.7);
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.78rem;
      cursor: pointer;
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      transition: all 0.2s ease;
      white-space: nowrap;
      padding: 0 5px;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 2px 6px rgba(211, 47, 47, 0.25);
    }

    .tab-badge {
      background: #ef4444;
      color: #fff;
      font-size: 0.68rem;
      padding: 1px 5px;
      border-radius: 10px;
      font-weight: 800;
    }

    .tab-btn.active .tab-badge {
      background: #ffffff;
      color: var(--primary);
    }

    .verify-all-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.55);
      border: 1.5px solid rgba(22, 163, 74, 0.4);
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .btn-verify-all {
      background: #16a34a;
      color: #ffffff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(22, 163, 74, 0.25);
    }

    .search-box {
      width: 100%;
      height: 40px;
      padding: 8px 12px;
      border: 1.5px solid rgba(203, 213, 225, 0.85);
      border-radius: 8px;
      font-size: 0.92rem;
      background-color: rgba(255, 255, 255, 0.55);
      margin-bottom: 12px;
      outline: none;
    }

    .search-box:focus {
      border-color: var(--primary);
      background-color: #ffffff;
    }

    .admin-card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(3px);
      border: 1.5px solid rgba(255, 255, 255, 0.8);
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }

    .admin-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .admin-card-header h3 {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .admin-details {
      font-size: 0.84rem;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .admin-card-actions {
      display: flex;
      gap: 8px;
      margin-top: 6px;
      align-items: center;
    }

    .action-btn {
      flex: 1;
      height: 34px;
      border-radius: 6px;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .btn-verify {
      background: rgba(22, 163, 74, 0.15);
      color: var(--success);
      border: 1px solid rgba(22, 163, 74, 0.4);
    }

    .btn-verified {
      background: #dcfce7;
      color: var(--success);
      font-weight: 700;
      cursor: default;
    }

    .btn-delete {
      background: rgba(220, 38, 38, 0.12);
      color: var(--danger);
      border: 1px solid rgba(220, 38, 38, 0.35);
      max-width: 90px;
    }

    .subadmin-form {
      background: rgba(255, 255, 255, 0.65);
      border: 1.5px solid rgba(203, 213, 225, 0.85);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .subadmin-input {
      width: 100%;
      height: 38px;
      padding: 6px 12px;
      border: 1.5px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.88rem;
      outline: none;
      background: #ffffff;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(2px);
      border: 1.5px solid rgba(255, 255, 255, 0.7);
      border-radius: var(--radius);
      padding: 24px 18px;
      margin-top: 14px;
      text-align: center;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
    }

    .login-input {
      width: 100%;
      height: 42px;
      padding: 8px 12px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 0.95rem;
      outline: none;
      background: rgba(255, 255, 255, 0.85);
    }

    .btn-login-submit {
      width: 100%;
      height: 42px;
      background: var(--primary);
      color: #ffffff;
      font-weight: 700;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-container">
      <div class="header-main-row">
        <a href="index.html" class="logo">
          <span class="logo-drop">🩸</span>
          <span class="logo-text">BADHAN</span>
          <span class="logo-zh-badge">ZH</span>
        </a>
      </div>

      <div class="header-nav-row">
        <a href="index.html" class="nav-chip">← মেইন সাইট</a>
        <button onclick="logoutAdmin()" class="nav-chip" id="logoutBtn" style="cursor: pointer; background: rgba(220, 38, 38, 0.12); color: #dc2626; border-color: rgba(220, 38, 38, 0.35); display: none;">Logout</button>
      </div>

      <div class="header-slogan-wrap">
        <p class="header-slogan">"একের রক্ত অন্যের জীবন, রক্তই হোক আত্মার বাঁধন"</p>
      </div>
    </div>
  </header>

  <main class="container">
    
    <!-- Login Section -->
    <div id="loginSection" class="login-card">
      <h2 style="color: var(--primary); font-size: 1.25rem; font-weight: 800; margin-bottom: 4px;">অ্যাডমিন প্যানেল লগইন</h2>
      <p style="font-size: 0.84rem; color: var(--text-muted); margin-bottom: 16px;">আপনার অ্যাডমিন ইমেইল ও পাসওয়ার্ড প্রদান করুন</p>
      
      <form onsubmit="handleAdminLogin(event)">
        <input type="email" id="adminEmail" class="login-input" placeholder="ইমেইল (Email)..." required />
        <input type="password" id="adminPassword" class="login-input" placeholder="পাসওয়ার্ড (Password)..." required />
        <button type="submit" class="btn-login-submit" id="loginBtn">লগইন করুন</button>
      </form>
    </div>

    <!-- Admin Panel Content -->
    <div id="adminPanel" style="display: none;">
      <h2 style="font-size: 1.2rem; font-weight: 800; color: var(--primary); text-align: center; margin: 8px 0 6px 0;">অ্যাডমিন কন্ট্রোল</h2>

      <!-- Navigation Tabs -->
      <div class="admin-controls">
        <button class="tab-btn active" id="tabDonors" onclick="switchTab('donors')">👥 ডোনার</button>
        <button class="tab-btn" id="tabPending" onclick="switchTab('pending')">
          ⏳ পেন্ডিং <span class="tab-badge" id="pendingBadge">0</span>
        </button>
        <button class="tab-btn" id="tabReports" onclick="switchTab('reports')">⚠️ রিপোর্ট</button>
        <button class="tab-btn superadmin-only" id="tabFeedback" onclick="switchTab('feedback')">
          💬 মতামত <span class="tab-badge" id="feedbackBadge" style="background:#2563eb;">0</span>
        </button>
        <button class="tab-btn superadmin-only" id="tabSubadmins" onclick="switchTab('subadmins')">➕ সাব-এডমিন</button>
      </div>

      <!-- Verify All Bar -->
      <div id="verifyAllContainer" style="display: none;">
        <div class="verify-all-bar">
          <span style="font-size: 0.86rem; font-weight: 700; color: #166534;" id="pendingCountText">পেন্ডিং ডোনার: 0 জন</span>
          <button onclick="verifyAllPendingDonors()" class="btn-verify-all" id="btnVerifyAll">সবাইকে অনুমোদন দিন (Verify All)</button>
        </div>
      </div>

      <input type="text" id="adminSearch" class="search-box" placeholder="নাম, হল, রক্ত বা জেলা দিয়ে সার্চ করুন..." oninput="filterAdminList()" />

      <div id="adminContentList"></div>
    </div>

  </main>

  <footer class="footer">
    <div class="footer-container">
      <p class="footer-notice">BADHAN ZH — অ্যাডমিন কন্ট্রোল প্যানেল</p>
      <p class="footer-credit">Designed & Developed by <a href="developer.html">Amanulla Emon</a></p>
    </div>
  </footer>

  <script>
    const SUPABASE_URL = "https://qqwuweskgtoqigfvvfso.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_A1qWn9h-TYg1dXxOgbYlxg_MXanpCxA";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const SUPER_ADMIN_EMAIL = "amanullaemon04@gmail.com";

    let currentTab = 'donors';
    let currentUserRole = 'superadmin';
    let allDonorsCache = [];
    let allReportsCache = [];
    let allFeedbackCache = [];
    let allSubadminsCache = [];

    // UPDATED REPORT REASON TEXT MAPPER
    function getReportReasonText(reason) {
      if (!reason) return "কোনো কারণ উল্লেখ নেই";

      const reasonMap = {
        "1": "রক্ত দিয়ে ফেলেছেন (অপ্রাপ্য)",
        "2": "ফোন বন্ধ / ধরছেন না",
        "3": "ভুল নম্বর / অস্তিত্ব নেই"
      };

      const trimmed = String(reason).trim();

      // 1, 2 ba 3 hole bracket-e karon-ti dekhabe
      if (reasonMap[trimmed]) {
        return `${trimmed} (${reasonMap[trimmed]})`;
      }

      // 4 ba custom onnanno karon hole
      if (trimmed.startsWith("4")) {
        const detail = trimmed.replace(/^4[:\s-]*/, '').trim();
        return detail ? `৪ (অন্যান্য: ${detail})` : `৪ (অন্যান্য সমস্যা)`;
      }

      return trimmed;
    }

    function getDonationStatus(donor) {
      let isAvailable = true;
      let nextDateStr = null;

      if (donor.last_donation) {
        const donationDate = new Date(donor.last_donation);
        if (!isNaN(donationDate.getTime())) {
          const nextEligibleDate = new Date(donationDate);
          nextEligibleDate.setDate(nextEligibleDate.getDate() + 90);

          const today = new Date();
          if (today < nextEligibleDate) {
            isAvailable = false;
            nextDateStr = nextEligibleDate.toISOString().split("T")[0];
          }
        }
      }

      if (donor.status && donor.status.toLowerCase() === "unavailable") {
        isAvailable = false;
      }

      if (donor.status && donor.status.toLowerCase() === "available" && donor.phone === "01608575239") {
        isAvailable = true;
      }

      return { isAvailable, nextDateStr };
    }

    async function handleAdminLogin(e) {
      e.preventDefault();
      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value;
      const btn = document.getElementById('loginBtn');

      btn.disabled = true;
      btn.textContent = "যাচাই করা হচ্ছে...";

      try {
        // 1. Super Admin Auth
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        
        if (!error && data?.session) {
          currentUserRole = 'superadmin';
          localStorage.setItem('badhan_admin_role', 'superadmin');
          showAdminPanel();
          return;
        }

        // 2. Sub-Admin Table
        const { data: subadmins, error: subErr } = await supabaseClient
          .from('admin_users')
          .select('*')
          .eq('email', email)
          .eq('password', password);

        if (subErr) throw subErr;

        if (subadmins && subadmins.length > 0) {
          currentUserRole = 'subadmin';
          localStorage.setItem('badhan_admin_role', 'subadmin');
          localStorage.setItem('badhan_subadmin_email', email);
          showAdminPanel();
          return;
        }

        throw new Error("ভুল ইমেইল অথবা পাসওয়ার্ড!");
      } catch (err) {
        alert("লগইন ব্যর্থ হয়েছে: " + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "লগইন করুন";
      }
    }

    async function logoutAdmin() {
      await supabaseClient.auth.signOut();
      localStorage.removeItem('badhan_admin_role');
      localStorage.removeItem('badhan_subadmin_email');
      window.location.reload();
    }

    function showAdminPanel() {
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('adminPanel').style.display = 'block';
      document.getElementById('logoutBtn').style.display = 'inline-flex';

      if (currentUserRole === 'subadmin') {
        document.querySelectorAll('.superadmin-only').forEach(el => el.style.display = 'none');
      } else {
        document.querySelectorAll('.superadmin-only').forEach(el => el.style.display = 'inline-flex');
      }

      loadAdminData();
    }

    async function checkCurrentSession() {
      const savedRole = localStorage.getItem('badhan_admin_role');
      if (savedRole === 'subadmin') {
        currentUserRole = 'subadmin';
        showAdminPanel();
        return;
      }

      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        currentUserRole = 'superadmin';
        showAdminPanel();
      }
    }

    function switchTab(tab) {
      if (currentUserRole === 'subadmin' && (tab === 'feedback' || tab === 'subadmins')) {
        tab = 'donors';
      }

      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1));
      if (activeBtn) activeBtn.classList.add('active');

      const verifyAllContainer = document.getElementById('verifyAllContainer');
      const searchBox = document.getElementById('adminSearch');

      if (tab === 'pending') {
        verifyAllContainer.style.display = 'block';
        searchBox.placeholder = "পেন্ডিং ডোনারের নাম বা জেলা দিয়ে খুঁজুন...";
      } else if (tab === 'donors') {
        verifyAllContainer.style.display = 'none';
        searchBox.placeholder = "নাম, হল, রক্ত বা জেলা দিয়ে সার্চ করুন...";
      } else if (tab === 'reports') {
        verifyAllContainer.style.display = 'none';
        searchBox.placeholder = "রিপোর্টের কারণ বা ডোনারের নাম দিয়ে খুঁজুন...";
      } else if (tab === 'feedback') {
        verifyAllContainer.style.display = 'none';
        searchBox.placeholder = "মতামত প্রদানকারীর নাম দিয়ে খুঁজুন...";
      } else if (tab === 'subadmins') {
        verifyAllContainer.style.display = 'none';
        searchBox.placeholder = "সাব-এডমিনের ইমেইল দিয়ে খুঁজুন...";
      }

      searchBox.value = "";
      renderAdminList();
    }

    async function loadAdminData() {
      const listContainer = document.getElementById('adminContentList');
      listContainer.innerHTML = `<div class="no-results">ডাটা লোড হচ্ছে...</div>`;

      try {
        const { data: donorsData } = await supabaseClient.from('donors').select('*').order('id', { ascending: false });
        allDonorsCache = donorsData || [];

        const { data: reportsData } = await supabaseClient.from('reports').select('*').order('id', { ascending: false });
        allReportsCache = reportsData || [];

        if (currentUserRole === 'superadmin') {
          try {
            const { data: feedbackData } = await supabaseClient.from('feedback').select('*').order('id', { ascending: false });
            allFeedbackCache = feedbackData || [];
          } catch(e) { allFeedbackCache = []; }

          try {
            const { data: subData } = await supabaseClient.from('admin_users').select('*').order('id', { ascending: false });
            allSubadminsCache = (subData || []).filter(s => s.email.toLowerCase() !== SUPER_ADMIN_EMAIL.toLowerCase());
          } catch(e) { allSubadminsCache = []; }

          document.getElementById('feedbackBadge').textContent = allFeedbackCache.length;
        }

        const pendingCount = allDonorsCache.filter(d => !d.verified).length;
        document.getElementById('pendingBadge').textContent = pendingCount;
        document.getElementById('pendingCountText').textContent = `পেন্ডিং ডোনার: ${pendingCount} জন`;

        renderAdminList();
      } catch (err) {
        listContainer.innerHTML = `<div class="no-results" style="color: var(--danger);">ত্রুটি: ${err.message}</div>`;
      }
    }

    function renderAdminList() {
      const listContainer = document.getElementById('adminContentList');
      const query = document.getElementById('adminSearch').value.trim().toLowerCase();

      // TAB: DONORS or PENDING
      if (currentTab === 'donors' || currentTab === 'pending') {
        let donors = allDonorsCache;
        if (currentTab === 'pending') donors = donors.filter(d => !d.verified);

        if (query) {
          donors = donors.filter(d => 
            (d.name && d.name.toLowerCase().includes(query)) ||
            (d.blood_group && d.blood_group.toLowerCase().includes(query)) ||
            (d.location && d.location.toLowerCase().includes(query)) ||
            (d.city && d.city.toLowerCase().includes(query))
          );
        }

        if (donors.length === 0) {
          listContainer.innerHTML = currentTab === 'pending'
            ? `<div class="no-results" style="color: var(--success); font-weight: 700;">🎉 কোনো পেন্ডিং ভেরিফিকেশন নেই! সব ডোনার অনুমোদিত।</div>`
            : `<div class="no-results">কোনো ডোনার পাওয়া যায়নি।</div>`;
          return;
        }

        listContainer.innerHTML = donors.map(d => {
          const { isAvailable, nextDateStr } = getDonationStatus(d);
          const statusText = isAvailable ? "AVAILABLE" : "UNAVAILABLE";
          const statusColor = isAvailable ? "var(--success)" : "var(--danger)";
          let nextDateInfo = (!isAvailable && nextDateStr) ? ` <span style="font-size:0.75rem; color:#b91c1c;">(পরবর্তী: ${escapeHtml(nextDateStr)})</span>` : "";

          return `
            <div class="admin-card">
              <div class="admin-card-header">
                <h3>${escapeHtml(d.name)}</h3>
                <span class="blood-badge">${escapeHtml(d.blood_group)}</span>
              </div>
              <div class="admin-details">
                <div>📞 মোবাইল: <strong>${escapeHtml(d.phone)}</strong></div>
                <div>📍 জেলা: <strong>${escapeHtml(d.city || '')} (${escapeHtml(d.location || '')})</strong></div>
                <div>🗓️ শেষ রক্তদান: <strong>${escapeHtml(d.last_donation || 'তথ্য নেই')}</strong></div>
                <div>⚡ প্রাপ্যতা: <strong style="color: ${statusColor};">${statusText}</strong>${nextDateInfo}</div>
              </div>
              <div class="admin-card-actions">
                ${d.verified 
                  ? `<span class="action-btn btn-verified">অনুমোদিত (Verified)</span>` 
                  : `<button onclick="verifyDonor('${d.id}')" class="action-btn btn-verify">অনুমোদন দিন</button>`
                }
                <button onclick="toggleDonorStatus('${d.id}', ${isAvailable})" class="action-btn" style="background: rgba(59, 130, 246, 0.15); color: #2563eb; border: 1px solid rgba(59, 130, 246, 0.4);">
                  ${isAvailable ? 'Make Unavailable' : 'Make Available'}
                </button>
                <button onclick="deleteDonor('${d.id}')" class="action-btn btn-delete">Delete</button>
              </div>
            </div>
          `;
        }).join('');

      // TAB: REPORTS
      } else if (currentTab === 'reports') {
        let reports = allReportsCache;
        if (query) {
          reports = reports.filter(r => 
            (r.donor_name && r.donor_name.toLowerCase().includes(query)) || 
            (r.rea
