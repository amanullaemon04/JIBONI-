<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>তথ্য আপডেট - JIBONI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-container">
      <div class="header-main-row">
        <a href="index.html" class="logo">
          <span class="logo-drop">🩸</span>
          <span class="logo-text">JIBONI</span>
        </a>
      </div>

      <div class="header-nav-row">
        <a href="index.html" class="nav-chip">← হোম পেজ</a>
        <a href="register.html" class="nav-chip">➕ ডোনার নিবন্ধন</a>
        <a href="developer.html" class="nav-chip">👨‍💻 ডেভেলপার</a>
      </div>

      <div class="header-slogan-wrap">
        <p class="header-slogan">"অচেনা কাউকে বাঁচার আশা দিয়ে, লিখে যাও এক নিঃস্বার্থ জীবনী।"</p>
      </div>
    </div>
  </header>

  <!-- Update Profile Form Container -->
  <main class="container">
    <div class="card">
      <h1 class="card-title">রক্তদাতার তথ্য আপডেট</h1>
      <p class="card-subtitle">আপনার নিবন্ধিত মোবাইল নম্বর ও পিন দিয়ে তথ্য হালনাগাদ করুন</p>

      <form id="verifyForm" class="auth-form">
        <div class="form-group">
          <label for="verifyPhone">নিবন্ধিত মোবাইল নম্বর:</label>
          <input type="tel" id="verifyPhone" required placeholder="01XXXXXXXXX" class="form-control" />
        </div>

        <div class="form-group">
          <label for="verifyPin">সিক্রেট পিন:</label>
          <input type="password" id="verifyPin" required placeholder="****" class="form-control" />
        </div>

        <button type="submit" class="btn btn-secondary" id="verifyBtn">প্রোফাইল লোড করুন</button>
      </form>

      <!-- Hidden Update Form (Shown after verification) -->
      <form id="updateForm" class="auth-form" style="display:none; margin-top: 20px;">
        <div class="form-group">
          <label for="editDistrict">বর্তমান জেলা:</label>
          <select id="editDistrict" class="form-control"></select>
        </div>

        <div class="form-group">
          <label for="editLastDonation">সর্বশেষ রক্তদানের তারিখ:</label>
          <input type="date" id="editLastDonation" class="form-control" />
        </div>

        <div class="form-group">
          <label for="editAvailability">রক্তদানে প্রস্তুতি স্ট্যাটাস:</label>
          <select id="editAvailability" class="form-control">
            <option value="true">রক্তদানে প্রস্তুত (Available)</option>
            <option value="false">বর্তমানে অনুপলব্ধ (Unavailable)</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary" id="saveBtn">হালনাগাদ সংরক্ষণ করুন</button>
      </form>

      <div id="updateStatus" class="status-msg" style="display:none;"></div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-container">
      <p class="footer-notice">JIBONI — প্রতিটি ফোঁটা রক্তে বাঁচে একটি প্রাণ</p>
      <p class="footer-credit">Designed & Developed by <a href="developer.html">Amanulla Emon</a></p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
