<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>পাসওয়ার্ড রিসেট - JIBONI</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Hind+Siliguri:wght@500;600;700&display=swap');

    :root {
      --primary: #dc2626;
      --primary-hover: #b91c1c;
      --primary-light: #fee2e2;
      --success: #15803d;
      --success-light: #dcfce7;
      --slate-50: #f8fafc;
      --slate-100: #f1f5f9;
      --slate-200: #e2e8f0;
      --slate-600: #475569;
      --slate-800: #1e293b;
      --slate-900: #0f172a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Hind Siliguri', 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--slate-50);
      color: var(--slate-800);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .site-header {
      background: #ffffff;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--slate-200);
      text-align: center;
      width: 100%;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
    }

    .blood-drop {
      font-size: 1.5rem;
      line-height: 1;
    }

    .brand-name {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--primary);
    }

    .app-main {
      flex: 1;
      max-width: 440px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 16px;
    }

    .card {
      background: #ffffff;
      border: 1px solid var(--slate-200);
      border-radius: 14px;
      padding: 24px 20px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03);
      text-align: center;
    }

    .title {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--slate-900);
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.82rem;
      color: var(--slate-600);
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .input-field {
      text-align: left;
      margin-bottom: 14px;
    }

    .field-label {
      display: block;
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--slate-800);
      margin-bottom: 6px;
    }

    .custom-input {
      width: 100%;
      height: 44px;
      padding: 0 14px;
      border: 1px solid var(--slate-200);
      border-radius: 10px;
      font-size: 0.88rem;
      color: var(--slate-800);
      outline: none;
      background: #ffffff;
    }

    .custom-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(220, 38, 38, 0.1);
    }

    .btn-primary {
      width: 100%;
      height: 44px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      margin-top: 6px;
    }

    .btn-back {
      width: 100%;
      height: 40px;
      background: var(--slate-100);
      color: var(--slate-600);
      border: 1px solid var(--slate-200);
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      margin-top: 8px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .alert-box {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.84rem;
      font-weight: 700;
      text-align: center;
      display: none;
    }

    .site-footer {
      background: #ffffff;
      border-top: 1px solid var(--slate-200);
      padding: 14px 16px;
      text-align: center;
      margin-top: auto;
      font-size: 0.75rem;
      color: var(--slate-600);
    }
  </style>
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="brand-logo">
      <span class="blood-drop">🩸</span>
      <span class="brand-name">JIBONI</span>
    </a>
  </header>

  <main class="app-main">
    <div class="card">
      <h1 class="title">নিরাপদ পাসওয়ার্ড রিসেট</h1>
      <p class="subtitle">আপনার সাব-অ্যাডমিন ইমেইল ও অ্যাডমিন প্যানেল থেকে প্রাপ্ত সিক্রেট পিন দিন।</p>

      <!-- Step 1: Verification Form -->
      <div id="step1Box">
        <div class="input-field">
          <label class="field-label" for="resetEmail">ইমেইল অ্যাড্রেস</label>
          <input type="email" id="resetEmail" class="custom-input" placeholder="admin@jiboni.org" required />
        </div>

        <div class="input-field">
          <label class="field-label" for="resetPin">৪ ডিজিটের সিক্রেট পিন (Recovery PIN)</label>
          <input type="password" id="resetPin" class="custom-input" placeholder="****" maxlength="4" required />
        </div>

        <button type="button" class="btn-primary" onclick="verifySubAdminPin()">যাচাই করুন</button>
      </div>

      <!-- Step 2: New Password Form (Only shown after valid PIN verification) -->
      <div id="step2Box" style="display: none;">
        <div class="input-field">
          <label class="field-label" for="newPassword">নতুন পাসওয়ার্ড দিন</label>
          <input type="password" id="newPassword" class="custom-input" placeholder="নতুন পাসওয়ার্ড (কমপক্ষে ৪ অক্ষর)" required />
        </div>

        <button type="button" class="btn-primary" onclick="saveSubAdminNewPassword()">পাসওয়ার্ড আপডেট সম্পন্ন করুন</button>
      </div>

      <a href="admin.html" class="btn-back">← লগইনে ফিরে যান</a>
      <div id="resetAlert" class="alert-box"></div>
    </div>
  </main>

  <footer class="site-footer">
    <p>JIBONI — অ্যাডমিন কন্ট্রোল প্যানেল</p>
  </footer>

  <script>
    var verifiedSubAdmin = null;

    function verifySubAdminPin() {
      var email = (document.getElementById("resetEmail").value || "").trim().toLowerCase();
      var pin = (document.getElementById("resetPin").value || "").trim();
      var alertBox = document.getElementById("resetAlert");
      alertBox.style.display = "block";

      if (!email || !pin) {
        alertBox.style.background = "#fee2e2";
        alertBox.style.color = "#b91c1c";
        alertBox.innerText = "ইমেইল এবং সিক্রেট পিন উভয়ই প্রদান করুন!";
        return;
      }

      if (email === "amanullaemon04@gmail.com") {
        alertBox.style.background = "#fee2e2";
        alertBox.style.color = "#b91c1c";
        alertBox.innerText = "Super Admin পাসওয়ার্ড সুরক্ষার জন্য কোডের ভেতরে সংরক্ষিত।";
        return;
      }

      var admins = JSON.parse(localStorage.getItem("jiboni_admin_accounts") || "[]");
      var target = admins.find(function(a) { 
        return a.email.toLowerCase() === email && String(a.recovery_pin || "1234") === String(pin); 
      });

      if (target) {
        verifiedSubAdmin = target;
        alertBox.style.background = "#dcfce7";
        alertBox.style.color = "#15803d";
        alertBox.innerText = "পিন যাচাই সফল হয়েছে! এবার আপনার নতুন পাসওয়ার্ড সেট করুন।";

        document.getElementById("step1Box").style.display = "none";
        document.getElementById("step2Box").style.display = "block";
      } else {
        alertBox.style.background = "#fee2e2";
        alertBox.style.color = "#b91c1c";
        alertBox.innerText = "ভুল তথ্য! ইমেইল অথবা সিক্রেট পিন মেলেনি। প্রয়োজনে Super Admin-এর সাথে যোগাযোগ করুন।";
      }
    }

    function saveSubAdminNewPassword() {
      var newPass = (document.getElementById("newPassword").value || "").trim();
      var alertBox = document.getElementById("resetAlert");
      alertBox.style.display = "block";

      if (!newPass || newPass.length < 4) {
        alertBox.style.background = "#fee2e2";
        alertBox.style.color = "#b91c1c";
        alertBox.innerText = "কমপক্ষে ৪ ডিজিটের নতুন পাসওয়ার্ড দিন!";
        return;
      }

      if (verifiedSubAdmin) {
        var admins = JSON.parse(localStorage.getItem("jiboni_admin_accounts") || "[]");
        var target = admins.find(function(a) { return a.email.toLowerCase() === verifiedSubAdmin.email.toLowerCase(); });
        
        if (target) {
          target.pass = newPass;
          localStorage.setItem("jiboni_admin_accounts", JSON.stringify(admins));

          alertBox.style.background = "#dcfce7";
          alertBox.style.color = "#15803d";
          alertBox.innerHTML = "পাসওয়ার্ড সফলভাবে হালনাগাদ করা হয়েছে!<br>কিছুক্ষণের মধ্যে লগইন পেইজে নিয়ে যাওয়া হচ্ছে...";

          setTimeout(function() {
            window.location.href = "admin.html";
          }, 1500);
        }
      }
    }
  </script>
</body>
</html>
