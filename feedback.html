<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>মতামত ও ফিডব্যাক - JIBONI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-container">
      <div class="header-main-row">
        <a href="index.html" class="logo">
          <span class="logo-drop">🩸</span>
          <span class="logo-text">JIBONI</span>
        </a>
      </div>

      <div class="header-nav-row">
        <a href="index.html" class="nav-chip">← হোম পেজ</a>
        <a href="guidelines.html" class="nav-chip">📖 নির্দেশিকা</a>
        <a href="developer.html" class="nav-chip">👨‍💻 ডেভেলপার</a>
      </div>

      <div class="header-slogan-wrap">
        <p class="header-slogan">"অচেনা কাউকে বাঁচার আশা দিয়ে, লিখে যাও এক নিঃস্বার্থ জীবনী।"</p>
      </div>
    </div>
  </header>

  <!-- Feedback Container -->
  <main class="container">
    <div class="card">
      <h1 class="card-title">আপনার মূল্যবান মতামত</h1>
      <p class="card-subtitle">JIBONI প্ল্যাটফর্মকে আরও উন্নত করতে আপনার পরামর্শ লিখুন</p>

      <form id="feedbackForm" class="auth-form">
        <div class="form-group">
          <label for="fbName">আপনার নাম:</label>
          <input type="text" id="fbName" placeholder="নাম লিখুন (ঐচ্ছিক)" class="form-control" />
        </div>

        <div class="form-group">
          <label for="fbContact">মোবাইল বা ইমেইল:</label>
          <input type="text" id="fbContact" placeholder="যোগাযোগের নম্বর/ইমেইল (ঐচ্ছিক)" class="form-control" />
        </div>

        <div class="form-group">
          <label for="fbMessage">বার্তা বা পরামর্শ: *</label>
          <textarea id="fbMessage" rows="5" required placeholder="আপনার মতামত বিস্তারিত লিখুন..." class="form-control" style="resize: vertical;"></textarea>
        </div>

        <button type="submit" class="btn btn-primary" id="fbSubmitBtn">ফিডব্যাক পাঠান</button>
      </form>

      <div id="fbStatus" class="status-msg" style="display:none;"></div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-container">
      <p class="footer-notice">JIBONI — রক্তদানে সচেতনতা আমাদের লক্ষ্য</p>
      <p class="footer-credit">Designed & Developed by <a href="developer.html">Amanulla Emon</a></p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
