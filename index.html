<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JIBONI - জীবন বাঁচুক ভালোবাসায়</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Hind+Siliguri:wght@500;600;700&display=swap');

    :root {
      --primary: #dc2626;
      --primary-hover: #b91c1c;
      --primary-light: #fee2e2;
      --success: #15803d;
      --success-light: #dcfce7;
      --warning: #b45309;
      --warning-light: #fef3c7;
      --info: #0284c7;
      --info-light: #e0f2fe;
      --slate-50: #f8fafc;
      --slate-100: #f1f5f9;
      --slate-200: #e2e8f0;
      --slate-400: #94a3b8;
      --slate-600: #475569;
      --slate-800: #1e293b;
      --slate-900: #0f172a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Hind Siliguri', 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--slate-50);
      color: var(--slate-800);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .site-header {
      background: #ffffff;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--slate-200);
      text-align: center;
      width: 100%;
    }

    .header-inner {
      max-width: 480px;
      margin: 0 auto;
    }

    .brand-row {
      margin-bottom: 8px;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
    }

    .blood-drop {
      font-size: 1.5rem;
      line-height: 1;
    }

    .brand-name {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: 0.5px;
      line-height: 1;
    }

    .nav-btn-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }

    .btn-chip {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1px solid var(--slate-200);
      background: var(--slate-100);
      color: var(--slate-600);
      cursor: pointer;
    }

    .btn-chip-red {
      background: var(--primary);
      color: #ffffff !important;
      border-color: var(--primary);
    }

    .brand-slogan {
      font-size: 0.74rem;
      color: var(--slate-600);
      font-style: italic;
    }

    .app-main {
      flex: 1;
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
      padding: 16px 14px 40px;
    }

    .filter-card {
      background: #ffffff;
      border: 1px solid var(--slate-200);
      border-radius: 14px;
      padding: 18px 16px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03);
      margin-bottom: 16px;
    }

    .input-group {
      margin-bottom: 12px;
      text-align: left;
    }

    .input-group:last-child {
      margin-bottom: 0;
    }

    .field-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--slate-800);
      margin-bottom: 5px;
    }

    .select-input,
    .text-input {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      background: #ffffff;
      border: 1px solid var(--slate-200);
      border-radius: 10px;
      font-size: 0.88rem;
      color: var(--slate-800);
      outline: none;
      transition: all 0.2s;
    }

    .select-input:focus,
    .text-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(220, 38, 38, 0.1);
    }

    .results-notice {
      background: #ffffff;
      border: 1px dashed var(--slate-200);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      color: var(--slate-600);
      font-size: 0.86rem;
    }

    .donor-card {
      background: #ffffff;
      border: 1px solid var(--slate-200);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    }

    .donor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .donor-name {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--slate-900);
    }

    .blood-badge {
      background: #fff1f2;
      color: var(--primary);
      border: 1px solid #ffe4e6;
      font-weight: 800;
      font-size: 0.85rem;
      padding: 2px 10px;
      border-radius: 8px;
    }

    .donor-meta {
      display: grid;
      gap: 5px;
      font-size: 0.82rem;
      color: var(--slate-600);
      margin-bottom: 12px;
    }

    .meta-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.74rem;
    }

    .status-avail {
      background: var(--success-light);
      color: var(--success);
    }

    .status-rest {
      background: var(--warning-light);
      color: var(--warning);
    }

    .call-btn {
      width: 100%;
      height: 38px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
    }

    .footer-nav {
      background: #ffffff;
      border-top: 1px solid var(--slate-200);
      padding: 12px;
      display: flex;
      justify-content: center;
      gap: 16px;
      font-size: 0.78rem;
      margin-top: auto;
    }

    .footer-nav a {
      color: var(--slate-600);
      text-decoration: none;
      font-weight: 600;
    }

    .footer-nav a:hover {
      color: var(--primary);
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="brand-row">
        <a href="index.html" class="brand-logo">
          <span class="blood-drop">🩸</span>
          <span class="brand-name">JIBONI</span>
        </a>
      </div>

      <div class="nav-btn-row">
        <a href="register.html" class="btn-chip btn-chip-red">+ রক্তদাতা হন</a>
        <a href="update-profile.html" class="btn-chip">👤 প্রোফাইল</a>
        <a href="admin.html" class="btn-chip">⚙️ Admin</a>
      </div>

      <p class="brand-slogan">"অচেনা কাউকে বাঁচার আশা দিয়ে, লিখে যাও এক নিঃস্বার্থ জীবনী।"</p>
    </div>
  </header>

  <main class="app-main">
    <div class="filter-card">
      <div class="input-group">
        <label class="field-label" for="filterBlood">রক্তের গ্রুপ (Blood Group)</label>
        <select id="filterBlood" class="select-input" onchange="runFilter()">
          <option value="">সকল গ্রুপ (All Groups)</option>
          <option value="A+">A+</option>
          <option value="A-">A-</option>
          <option value="B+">B+</option>
          <option value="B-">B-</option>
          <option value="AB+">AB+</option>
          <option value="AB-">AB-</option>
          <option value="O+">O+</option>
          <option value="O-">O-</option>
        </select>
      </div>

      <div class="input-group">
        <label class="field-label" for="filterDistrict">জেলা / শহর (City / District)</label>
        <select id="filterDistrict" class="select-input" onchange="runFilter()">
          <option value="">সকল জেলা (All Districts)</option>
          <option value="Dhaka">ঢাকা (Dhaka)</option>
          <option value="Chattogram">চট্টগ্রাম (Chattogram)</option>
          <option value="Rajshahi">রাজশাহী (Rajshahi)</option>
          <option value="Khulna">খুলনা (Khulna)</option>
          <option value="Barishal">বরিশাল (Barishal)</option>
          <option value="Sylhet">সিলেট (Sylhet)</option>
          <option value="Rangpur">রংপুর (Rangpur)</option>
          <option value="Mymensingh">ময়মনসিংহ (Mymensingh)</option>
          <option value="Nilphamari">নীলফামারী (Nilphamari)</option>
        </select>
      </div>

      <div class="input-group">
        <label class="field-label" for="filterLocation">নির্দিষ্ট এলাকা / হল (Specific Location)</label>
        <input type="text" id="filterLocation" class="text-input" placeholder="e.g. Zahurul Huq Hall (ঐচ্ছিক)" onkeyup="runFilter()" />
      </div>

      <div class="input-group">
        <label class="field-label" for="filterAvail">স্ট্যাটাস (Availability)</label>
        <select id="filterAvail" class="select-input" onchange="runFilter()">
          <option value="All">All</option>
          <option value="Available">রক্তদানে প্রস্তুত (Available)</option>
          <option value="Unavailable">অনুপলব্ধ (Resting)</option>
        </select>
      </div>
    </div>

    <div id="resultsWrapper">
      <div class="results-notice">
        📍 রক্তদাতা খুঁজতে অনুগ্রহ করে রক্তের গ্রুপ বা জেলা নির্বাচন করুন।
      </div>
    </div>
  </main>

  <footer class="footer-nav">
    <a href="stats.html">📊 রক্তের পরিসংখ্যান</a>
    <a href="feedback.html">💬 মতামত দিন</a>
    <a href="guidelines.html">📖 নির্দেশিকা</a>
  </footer>

  <script>
    function checkDonationEligibility(lastDonationDateStr) {
      if (!lastDonationDateStr || lastDonationDateStr === "তথ্য নেই") return true;
      var lastDate = new Date(lastDonationDateStr);
      var today = new Date();
      var diffDays = (today - lastDate) / (1000 * 60 * 60 * 24);
      return diffDays >= 120; // 4 months logic
    }

    function calculateNextEligibleDate(lastDonationDateStr) {
      if (!lastDonationDateStr || lastDonationDateStr === "তথ্য নেই") return null;
      var d = new Date(lastDonationDateStr);
      if (isNaN(d.getTime())) return null;
      d.setMonth(d.getMonth() + 4);
      var yyyy = d.getFullYear();
      var mm = String(d.getMonth() + 1).padStart(2, '0');
      var dd = String(d.getDate()).padStart(2, '0');
      return yyyy + "-" + mm + "-" + dd;
    }

    function getDonorsData() {
      var stored = localStorage.getItem("jiboni_donors_cache") || localStorage.getItem("donors");
      if (stored) {
        try {
          return JSON.parse(stored);
        } catch(e) {}
      }
      return [
        { id: 1, name: "Amanulla Emon", blood_group: "B+", phone: "01608575239", district: "Dhaka", hall: "Shahid Sergeant Zahurul Huq Hall", last_donation: "2026-09-02", is_available: false, is_verified: true },
        { id: 2, name: "Arafat", blood_group: "A+", phone: "01602689896", district: "Dhaka", hall: "Shahid Sergeant Zahurul Huq Hall", last_donation: "2026-08-02", is_available: false, is_verified: true }
      ];
    }

    function runFilter() {
      var blood = (document.getElementById("filterBlood").value || "").trim().toUpperCase();
      var district = (document.getElementById("filterDistrict").value || "").trim().toLowerCase();
      var loc = (document.getElementById("filterLocation").value || "").trim().toLowerCase();
      var avail = document.getElementById("filterAvail").value;

      var allDonors = getDonorsData();
      var container = document.getElementById("resultsWrapper");

      // Auto update availability according to 4-month rule
      allDonors.forEach(function(d) {
        var isEligible = checkDonationEligibility(d.last_donation);
        if (!isEligible && d.is_available && !d.manual_override) {
          d.is_available = false;
        }
      });

      // Filter query
      var results = allDonors.filter(function(d) {
        var dBlood = (d.blood_group || d.bloodGroup || "").toUpperCase();
        var dDistrict = (d.district || "").toLowerCase();
        var dHall = (d.hall || "").toLowerCase();

        // 1. Blood Filter
        if (blood && dBlood !== blood) return false;

        // 2. District Filter (Checks english or bangla token)
        if (district) {
          if (!dDistrict.includes(district) && !district.includes(dDistrict)) return false;
        }

        // 3. Specific location / Hall filter
        if (loc) {
          if (!dHall.includes(loc) && !dDistrict.includes(loc)) return false;
        }

        // 4. Availability Filter
        if (avail === "Available" && !d.is_available) return false;
        if (avail === "Unavailable" && d.is_available) return false;

        return true;
      });

      if (!blood && !district && !loc && avail === "All") {
        container.innerHTML = '<div class="results-notice">📍 রক্তদাতা খুঁজতে অনুগ্রহ করে রক্তের গ্রুপ বা জেলা নির্বাচন করুন।</div>';
        return;
      }

      if (results.length === 0) {
        container.innerHTML = '<div class="results-notice">❌ দুঃখিত, আপনার দেওয়া তথ্যানুযায়ী কোনো রক্তদাতা পাওয়া যায়নি।</div>';
        return;
      }

      var html = "";
      results.forEach(function(d) {
        var isEligible = checkDonationEligibility(d.last_donation);
        var nextDate = calculateNextEligibleDate(d.last_donation);

        var statusChip = d.is_available 
          ? '<span class="status-chip status-avail">● রক্তদানে প্রস্তুত (Available)</span>' 
          : '<span class="status-chip status-rest">⏳ বিরতি কালীন (4-Month Rest)</span>';

        var nextDateLine = "";
        if (nextDate && !isEligible) {
          nextDateLine = '<div class="meta-row">🗓️ <strong>পরবর্তী রক্তদান:</strong> <span style="color:var(--info); font-weight:700;">' + nextDate + ' (থেকে সম্ভাব্য)</span></div>';
        } else if (isEligible && d.last_donation && d.last_donation !== "তথ্য নেই") {
          nextDateLine = '<div class="meta-row">🗓️ <strong>পরবর্তী রক্তদান:</strong> <span style="color:var(--success); font-weight:700;">✅ যেকোনো সময় সক্ষম</span></div>';
        }

        html += 
          '<div class="donor-card">' +
            '<div class="donor-header">' +
              '<span class="donor-name">' + (d.name || "অজ্ঞাত নাম") + '</span>' +
              '<span class="blood-badge">' + (d.blood_group || d.bloodGroup || "--") + '</span>' +
            '</div>' +
            '<div class="donor-meta">' +
              '<div class="meta-row">📍 <strong>ঠিকানা/হল:</strong> ' + (d.district || "--") + (d.hall ? ' (' + d.hall + ')' : '') + '</div>' +
              '<div class="meta-row">🗓️ <strong>সর্বশেষ রক্তদান:</strong> ' + (d.last_donation || "তথ্য নেই") + '</div>' +
              '<div class="meta-row">⚡ <strong>স্ট্যাটাস:</strong> ' + statusChip + '</div>' +
              nextDateLine +
            '</div>' +
            '<a href="tel:' + d.phone + '" class="call-btn">📞 কল করুন (' + d.phone + ')</a>' +
          '</div>';
      });

      container.innerHTML = html;
    }

    // Run automatically on load if preset
    window.onload = function() {
      runFilter();
    };
  </script>
</body>
</html>
