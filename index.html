<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JIBONI - রক্তদাতা খুঁজুন</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-container">
      <div class="header-main-row">
        <a href="index.html" class="logo">
          <span class="logo-drop">🩸</span>
          <span class="logo-text">JIBONI</span>
        </a>
      </div>

      <div class="header-nav-row">
        <a href="register.html" class="nav-chip">➕ ডোনার নিবন্ধন</a>
        <a href="update-profile.html" class="nav-chip">✏️ তথ্য আপডেট</a>
        <a href="developer.html" class="nav-chip">👨‍💻 ডেভেলপার</a>
      </div>

      <div class="header-slogan-wrap">
        <p class="header-slogan">"অচেনা কাউকে বাঁচার আশা দিয়ে, লিখে যাও এক নিঃস্বার্থ জীবনী।"</p>
      </div>
    </div>
  </header>

  <!-- Main Search Container -->
  <main class="container">
    <div class="card">
      <h1 class="card-title">জরুরি রক্তের সন্ধান</h1>
      <p class="card-subtitle">নির্দিষ্ট রক্তের গ্রুপ ও জেলা নির্বাচন করে ডোনার খুঁজুন</p>

      <form id="searchForm" class="filter-form">
        <div class="form-group">
          <label for="bloodGroup">রক্তের গ্রুপ:</label>
          <select id="bloodGroup" name="bloodGroup" class="form-control">
            <option value="">সকল গ্রুপ</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
          </select>
        </div>

        <div class="form-group">
          <label for="district">জেলা:</label>
          <select id="district" name="district" class="form-control">
            <option value="">সকল জেলা</option>
            <!-- জেলা তালিকা স্ক্রিপ্ট থেকে ডায়নামিকালি লোড হবে -->
          </select>
        </div>

        <button type="submit" class="btn btn-primary" id="searchBtn">🔍 ডোনার খুঁজুন</button>
      </form>

      <!-- Status Indicator / Spinner -->
      <div id="loading" class="status-msg" style="display:none;">খোঁজা হচ্ছে... অপেক্ষা করুন।</div>

      <!-- Results List -->
      <div id="resultsList" class="results-grid"></div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-container">
      <p class="footer-notice">JIBONI — মানবতার সেবায় উৎসর্গীকৃত</p>
      <p class="footer-credit">Designed & Developed by <a href="developer.html">Amanulla Emon</a></p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
