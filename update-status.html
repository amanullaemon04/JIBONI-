<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>স্ট্যাটাস আপডেট - JIBONI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-container">
      <div class="header-main-row">
        <a href="index.html" class="logo">
          <span class="logo-drop">🩸</span>
          <span class="logo-text">JIBONI</span>
        </a>
      </div>

      <div class="header-nav-row">
        <a href="index.html" class="nav-chip">← হোম পেজ</a>
        <a href="update-profile.html" class="nav-chip">✏️ ফুল প্রোফাইল</a>
        <a href="developer.html" class="nav-chip">👨‍💻 ডেভেলপার</a>
      </div>

      <div class="header-slogan-wrap">
        <p class="header-slogan">"অচেনা কাউকে বাঁচার আশা দিয়ে, লিখে যাও এক নিঃস্বার্থ জীবনী।"</p>
      </div>
    </div>
  </header>

  <!-- Quick Status Container -->
  <main class="container">
    <div class="card">
      <h1 class="card-title">দ্রুত রক্তদান স্ট্যাটাস আপডেট</h1>
      <p class="card-subtitle">আপনি বর্তমানে রক্তদানে প্রস্তুত কি না তা সহজে পরিবর্তন করুন</p>

      <form id="statusQuickForm" class="auth-form">
        <div class="form-group">
          <label for="statusPhone">মোবাইল নম্বর: *</label>
          <input type="tel" id="statusPhone" required placeholder="01XXXXXXXXX" class="form-control" />
        </div>

        <div class="form-group">
          <label for="statusPin">৪ ডিজিট পিন: *</label>
          <input type="password" id="statusPin" required placeholder="****" class="form-control" />
        </div>

        <div class="form-group">
          <label for="newStatus">বর্তমান অবস্থা নির্বাচন করুন: *</label>
          <select id="newStatus" required class="form-control">
            <option value="true">✅ আমি রক্তদানে প্রস্তুত (Available)</option>
            <option value="false">❌ সাময়িকভাবে রক্তদানে অনুপলব্ধ (Unavailable)</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary" id="saveQuickStatusBtn">স্ট্যাটাস সেভ করুন</button>
      </form>

      <div id="quickStatusMsg" class="status-msg" style="display:none;"></div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-container">
      <p class="footer-notice">JIBONI — সেবাই হোক জীবনের মূল সুর</p>
      <p class="footer-credit">Designed & Developed by <a href="developer.html">Amanulla Emon</a></p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
