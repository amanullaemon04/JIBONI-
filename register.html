<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ডোনার নিবন্ধন - JIBONI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-container">
      <div class="header-main-row">
        <a href="index.html" class="logo">
          <span class="logo-drop">🩸</span>
          <span class="logo-text">JIBONI</span>
        </a>
      </div>

      <div class="header-nav-row">
        <a href="index.html" class="nav-chip">← হোম পেজ</a>
        <a href="update-profile.html" class="nav-chip">✏️ তথ্য আপডেট</a>
        <a href="developer.html" class="nav-chip">👨‍💻 ডেভেলপার</a>
      </div>

      <div class="header-slogan-wrap">
        <p class="header-slogan">"অচেনা কাউকে বাঁচার আশা দিয়ে, লিখে যাও এক নিঃস্বার্থ জীবনী।"</p>
      </div>
    </div>
  </header>

  <!-- Registration Form Container -->
  <main class="container">
    <div class="card">
      <h1 class="card-title">নতুন রক্তদাতা নিবন্ধন</h1>
      <p class="card-subtitle">আপনার মূল্যবান রক্তদানের তথ্য দিয়ে জীবন বাঁচাতে এগিয়ে আসুন</p>

      <form id="registerForm" class="auth-form">
        <div class="form-group">
          <label for="fullName">পূর্ণ নাম: *</label>
          <input type="text" id="fullName" name="fullName" required placeholder="আপনার নাম লিখুন" class="form-control" />
        </div>

        <div class="form-group">
          <label for="bloodGroup">রক্তের গ্রুপ: *</label>
          <select id="bloodGroup" name="bloodGroup" required class="form-control">
            <option value="">নির্বাচন করুন</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
          </select>
        </div>

        <div class="form-group">
          <label for="phone">মোবাইল নম্বর: *</label>
          <input type="tel" id="phone" name="phone" required placeholder="01XXXXXXXXX" class="form-control" />
        </div>

        <div class="form-group">
          <label for="district">জেলা: *</label>
          <select id="district" name="district" required class="form-control">
            <option value="">জেলা নির্বাচন করুন</option>
          </select>
        </div>

        <div class="form-group">
          <label for="hall">হল / বর্তমান ঠিকানা:</label>
          <input type="text" id="hall" name="hall" placeholder="উদাঃ শহীদ সার্জেন্ট জহুরুল হক হল" class="form-control" />
        </div>

        <div class="form-group">
          <label for="lastDonation">সর্বশেষ রক্তদানের তারিখ (যদি থাকে):</label>
          <input type="date" id="lastDonation" name="lastDonation" class="form-control" />
        </div>

        <div class="form-group">
          <label for="pin">সিক্রেট পিন (তথ্য আপডেটের জন্য ৪ ডিজিট): *</label>
          <input type="password" id="pin" name="pin" maxlength="6" required placeholder="****" class="form-control" />
        </div>

        <button type="submit" class="btn btn-primary" id="regBtn">নিবন্ধন সম্পন্ন করুন</button>
      </form>

      <div id="regStatus" class="status-msg" style="display:none;"></div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-container">
      <p class="footer-notice">JIBONI — রক্তদানে সচেতনতা আমাদের লক্ষ্য</p>
      <p class="footer-credit">Designed & Developed by <a href="developer.html">Amanulla Emon</a></p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
